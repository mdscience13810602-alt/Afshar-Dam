name: Build Afshar Dam APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AfsharDam-Final-Android-Source.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip AfsharDam-Final-Android-Source.zip

      - name: Build APK
        working-directory: AfsharDam
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfsharDam-APK
          path: AfsharDam/app/build/outputs/apk/debug/*.apk
